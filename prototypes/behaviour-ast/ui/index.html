<!doctype html>
<!--
  `data-theme` is what switches the design system's colour roles on; without it
  every --color-* role is unset and the page renders as unstyled HTML. "casual"
  is the coral/teal voice James picked on 2026-08-16 ("Coral teal looks good"),
  not a preference of mine. `data-mode="dark"` flips it; light is the default.
-->
<html lang="en" data-theme="casual">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
