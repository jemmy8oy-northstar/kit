<!doctype html>
<!--
  `data-theme` is what switches the design system's colour roles on; without it
  every --color-* role is unset and the page renders as unstyled HTML.
  "professional" (neutral greys, one blue accent) answers his 2026-10-16 note,
  "I want this ui to look more professional… a shadcn style ui?" (BEH-LOOK-1).
  It replaced "casual", the coral/teal voice he picked on 2026-08-16, which is
  one attribute away if he wants it back. `data-mode="dark"` flips either.
-->
<html lang="en" data-theme="professional">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kit</title>
    <!--
      BEH-NOTIFY-2: Add to Home Screen opens Kit full screen with its own name and icon.
      Absolute here, and Vite prefixes KIT_BASE_PATH at build; the manifest's own URLs are
      RELATIVE to it, so the installed app's scope stays /kit/ and never claims the shared
      host's root, which belongs to another app.
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4f6bed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kit" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
