name: CI

# `kit` is documentation, a Vite/React UI under prototypes/behaviour-ast/ui
# (#19) and a C# engine, server and CLI under ./backend. The plain-Node
# prototype the engine was ported from is deleted (kit#119), and so is the
# `prototype` job that ran its suite. It has no ./frontend, so the
# repo-template scaffold this replaces asserted the build of directories that did
# not exist and failed on every pull request — a red tick that meant nothing
# about the change under review.
#
# What runs here is the thing that exists. The `backend` job below is
# repo-template's, taken back out of the scaffold VERBATIM as this header said to
# do. ⚠️ It arrived late: #120 merged 48 C# tests that NO job ran, so the port's
# whole score — byte-for-byte against the Node goldens — was something only ever
# observed on the bot's machine ([[passing-is-not-gating]]), for two days.
#
# Job ids are the check context GitHub reports, and a branch ruleset requires
# them by exact string. `kit` has no rulesets today; if one is added, require
# `backend` and `ui` and rename them in both places or the check hangs forever.
#
# ✅ STAGE 0 *IS* GATED HERE — see the `Stage-0 gate` step in the `backend` job,
# which runs the C# `kit check kit --repo .` on every pull request (it was
# `node prototypes/behaviour-ast/check.js` until kit#119's cut 2).
# Kit checks ITSELF, against `behaviours/kit.beh` and the `kit.tests.json`
# mapping, so nothing here is pinned to another repository's HEAD.
#
# 🔑 The CI step arrived in `e5b1a15`, **three minutes after** the write-up that
# called it "a separate, smaller piece of work" — so this header was stale within
# the hour and stayed stale for eleven days. What is still NOT gated here is a
# check over any OTHER app's corpus: `kit check <app> --repo <path>` needs that
# app's repository, and wiring one in would pin kit's CI to its HEAD.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The C# engine port (#119). The goldens it is scored against live under
  # prototypes/, so the tests find them by walking up from the test binary —
  # which is why this needs the whole checkout and not just ./backend.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ./backend

      - name: Build
        run: dotnet build ./backend --no-restore --configuration Release

      # Drop this step only if the solution genuinely has no test project.
      # `dotnet test` over a solution containing none exits 0 having asserted
      # nothing — a green tick that means the opposite of what it looks like.
      - name: Test
        run: >
          dotnet test ./backend
          --no-build
          --configuration Release
          --verbosity normal

      # Stage 0's deliverable, applied to kit itself: a documented behaviour
      # with no test naming it fails the build. Kit is the first repo in the
      # estate where that sentence is true of the repo you are reading.
      #
      # The C# `kit check` (kit#119), replacing `node check.js kit --repo .`,
      # which it matches byte for byte. `--dir` is explicit because a CLI has no
      # script directory to default to.
      #
      # It gates on behaviour ids and the mapping in behaviours/kit.tests.json,
      # NOT on generated code — `docs/pilots/kit-self-hosting.md` measures why
      # Kit can derive nothing for itself (its verbs are `runs`/`exits`, the
      # generator's are all browser verbs). Those are different questions and
      # this step only answers the first.
      #
      # ⚠️ What a pass means: someone LINKED each behaviour to a test. It does
      # not prove the test asserts the behaviour. That limit is option C's and
      # is not fixable by parsing — `docs/design/tagging.md`.
      - name: Stage-0 gate — every kit behaviour is named by a test
        run: >
          dotnet run --project backend/Balenthiran.Kit.Cli
          --no-build
          --configuration Release
          -- check kit --repo . --dir prototypes/behaviour-ast/behaviours

  # The UI (#19) arrived with 20 passing tests and nothing that ran them. A
  # suite quoted in a PR body but executed by no gating job is a claim, not a
  # check — I have made that mistake before ([[passing-is-not-gating]]), so the
  # job exists specifically to stop "20 tests" from being something only I ever
  # observed on my own machine.
  #
  # Job id `ui` is the check context GitHub reports. kit still has no rulesets;
  # if one is ever added, require BOTH `backend` and `ui` by exact string.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/behaviour-ast/ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototypes/behaviour-ast/ui/package-lock.json

      # `@jemmy8oy-northstar/design-system` is a git-URL dependency, not a
      # published package — it is published nowhere, and pinning `main` would
      # get the token files without the `exports` entry naming them. npm runs
      # its `prepare` script for a git dep, so `dist/` is BUILT at install time
      # and the real Button/Card/Badge/Input arrive. The repo is public, so this
      # needs no credentials: verified by running `npm ci` against an empty HOME
      # with no ssh keys and no .npmrc, which is the shape a runner has.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b && vite build`. Type errors are only caught here — the Vitest
      # run does not typecheck, so dropping this step would let a broken build
      # merge behind a green suite.
      - name: Build
        run: npm run build

      # Runs from the repo root's checkout on purpose: `src/test/fixtures.test.ts`
      # reads `conformance/routes/read.json` and `src/test/contract.test.ts` reads
      # `backend/`, outside `ui/`. A job that copied only `ui/` would fail them.
      - name: Unit tests
        run: npm test
