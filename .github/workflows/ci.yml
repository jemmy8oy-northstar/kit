name: CI

# `kit` is documentation plus a Node prototype. It has no ./backend and no
# ./frontend, so the repo-template scaffold this replaces asserted the build of
# two directories that do not exist and failed on every pull request — a red
# tick that meant nothing about the change under review.
#
# What runs here is the thing that exists: the behaviour-AST prototype's own
# suite. When kit grows a real backend/frontend, take the scaffold's jobs back
# out of repo-template rather than rewriting them from memory — they carry the
# .NET/Playwright setup and the note on job ids below.
#
# Job ids are the check context GitHub reports, and a branch ruleset requires
# them by exact string. `kit` has no rulesets today; if one is added, require
# `prototype` and rename it in both places or the check hangs forever.
#
# ⚠️ WHAT IS STILL NOT GATED HERE: `check.js`, the stage-0 coverage gate. It
# takes `--repo <path>` to the app under test, and the only annotated corpus
# (snip-it) lives in another repository — wiring it would pin kit's CI to
# snip-it's HEAD, so a rename over there turns kit red. The obvious fix is for
# kit to check ITSELF, and it cannot: `TEST_FILE_RE` does not match
# `kit.test.js`, and titles are declared with a local `t(...)` helper that
# `JS_TITLE` does not read. Measured, not assumed —
# `node check.js snip-it --repo <kit>` exits 2, "cannot look: 0 test files".
# Until that is fixed, do not describe stage 0 as enforced anywhere.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No package.json and no dependencies on purpose — the prototype is
      # plain Node so that reading it needs nothing installed.
      - name: Behaviour-AST suite
        run: node prototypes/behaviour-ast/kit.test.js

      # A green suite says the tests pass; it does not say the tests would
      # NOTICE. `mutate.js` breaks kit.js/check.js/prose-audit.js/saturation.js
      # one rule at a time and requires the suite to go red for each. It has
      # been run by hand at every step and by nothing on merge, which means the
      # one property the suite is quoted for has never been enforced by the
      # thing that gates the branch ([[passing-is-not-gating]]).
      #
      # It runs the suite once per mutant, in-process, with no network and no
      # install — ~59 mutants in a few seconds today. If that stops being true,
      # move it to a scheduled job rather than dropping it.
      - name: Mutation gate — the suite must notice each broken rule
        run: node prototypes/behaviour-ast/mutate.js

      # Stage 0's deliverable, applied to kit itself: a documented behaviour
      # with no test naming it fails the build. Kit is the first repo in the
      # estate where that sentence is true of the repo you are reading.
      #
      # It gates on behaviour ids and the mapping in behaviours/kit.tests.json,
      # NOT on generated code — `docs/pilots/kit-self-hosting.md` measures why
      # Kit can derive nothing for itself (its verbs are `runs`/`exits`, the
      # generator's are all browser verbs). Those are different questions and
      # this step only answers the first.
      #
      # ⚠️ What a pass means: someone LINKED each behaviour to a test. It does
      # not prove the test asserts the behaviour. That limit is option C's and
      # is not fixable by parsing — `docs/design/tagging.md`.
      - name: Stage-0 gate — every kit behaviour is named by a test
        run: node prototypes/behaviour-ast/check.js kit --repo .
