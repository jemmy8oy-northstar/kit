fullnameOverride: "kit"
# Shared with every other app in the estate: one host, one wildcard cert, one
# namespace, and a path prefix per app. The ingress does NOT rewrite, so the app
# has to know its own prefix — which is what `KIT_BASE_PATH` below is for.
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: balenthiran.co.uk
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    - hosts:
        - balenthiran.co.uk
      secretName: balenthiran-tls # shared wildcard cert — no per-project TLS setup
registryPrefix: "lhr.ocir.io/lr7uc6l49odc" # shared OCIR namespace
apps:
  # ONE entry, not the backend/frontend pair. Kit has neither: `ui.js` serves the
  # SPA and the API from the same process and the same port.
  - name: kit
    image:
      repository: lhr.ocir.io/lr7uc6l49odc/kit
      # Patched by `docker-build-push.yml` on every push to main — GitOps, so
      # ArgoCD reads the new tag out of this file rather than watching OCIR.
      tag: 0.1.184
      pullPolicy: Always
    containerPort: 8080
    replicas: 1
    service:
      port: 80
      targetPort: 8080
    ingress:
      # 🔑 THIS LINE IS THE ONLY COPY OF KIT'S PATH, and three things read it:
      # the ingress rule (here), the container's `KIT_BASE_PATH`, which
      # `templates/deployment.yaml` DERIVES from this field rather than taking a
      # second value, and the image build, which greps it out of this file and
      # bakes it into the bundle's asset URLs.
      #
      # It is derived rather than repeated because two copies of a path is how
      # one of them ends up stale — and the symptom is a page that loads and does
      # nothing, with a 200 on every request, because an unmatched path on this
      # shared host is answered by the portfolio's SPA. To move Kit to a
      # subdomain, empty this and all three follow.
      path: /kit
      pathType: Prefix
    env:
      # The public origin the browser will really be on. It is what sets the
      # session cookie's `Secure` flag, so behind TLS it is not optional.
      - name: KIT_PUBLIC_ORIGIN
        value: "https://balenthiran.co.uk"
      # ⚠️ CREATED BY HAND, like every secret in this estate — no chart and no
      # fleet config creates one. The name and key are NOT free to choose here:
      # they have to match the command already given on kit#44.
      #
      #   kubectl create secret generic kit-auth \
      #     --from-literal=password=<the password> -n balenthiran
      #
      # Unset would mean an unlocked Kit on a public URL, and the pod refuses to
      # start writing in that state rather than serving one — see `auth.js`.
      - name: KIT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kit-auth
            key: password
      # Hosted write-back (kit#117, kit#92). Read by `docker-entrypoint.sh`, which
      # clones KIT_GIT_CLONE at KIT_GIT_BRANCH and points Kit at the clone, so
      # every edit is committed and pushed there and a restart loses nothing.
      # 🔑 The token is OPTIONAL on purpose: until the `kit-git` secret exists the
      # entrypoint does nothing, and Kit runs exactly as before. Required, a
      # missing secret would stop the pod starting at all.
      - name: KIT_GIT_CLONE
        value: "https://github.com/jemmy8oy-northstar/kit.git"
      - name: KIT_GIT_BRANCH
        value: "kit/hosted"
      - name: KIT_GIT_TOKEN
        valueFrom:
          secretKeyRef:
            name: kit-git
            key: token
            optional: true
      # Early-access accounts (BEH-USERS-1; the database he approved on BEH-USERS-4,
      # kit.notes.md#2026-10-23-0639). The `kit-database` secret is declared in
      # oke-fleet `secrets/kit.json` and filled by secret-provisioner. OPTIONAL on
      # purpose, like KIT_GIT_TOKEN: unset, accounts stay off and Kit keeps its one
      # password.
      - name: KIT_DATABASE
        valueFrom:
          secretKeyRef:
            name: kit-database
            key: connection
            optional: true
      # The GitHub App (kit#88: "the backend can use [it] to read and write to gh"),
      # from the `kit-github` secret James created on 2026-09-27. With these set the
      # entrypoint clones with a token the server mints, and every push mints its
      # own, so the `kit-git` token above is no longer needed. All three or none:
      # Kit refuses to start on a half-set credential rather than run without it.
      # The key names are the claude-code-bot secret's, which kit-github copies (kit#233: the
      # first guess, appid/installationid/privatekey, matched none, so all three were silently
      # absent and write-back stayed off). Check them with
      #   kubectl get secret kit-github -n balenthiran -o json | jq '.data | keys'
      - name: KIT_GITHUB_APP_ID
        valueFrom:
          secretKeyRef:
            name: kit-github
            key: GITHUB_APP_ID
            optional: true
      - name: KIT_GITHUB_INSTALLATION_ID
        valueFrom:
          secretKeyRef:
            name: kit-github
            key: GITHUB_APP_INSTALLATION_ID
            optional: true
      - name: KIT_GITHUB_PRIVATE_KEY
        valueFrom:
          secretKeyRef:
            name: kit-github
            key: private-key.pem
            optional: true
      # BEH-USERS-1 (kit#431): how an early-access user connects their GitHub, by
      # installing the App above on their own account (James made it public). Same
      # App, so the same `kit-github` secret (kit#433: "can't we use the existing
      # one?"). ⚠️ ADDED BY HAND, three keys patched onto it:
      #
      #   kubectl patch secret kit-github -n balenthiran --type merge -p \
      #     '{"stringData":{"slug":"<app-url-name>","client-id":"<client-id>","client-secret":"<client-secret>"}}'
      #
      # The App's callback URL is https://balenthiran.co.uk/kit/ with nothing after
      # the slash: GitHub appends ?code=...&state=... and Kit's page reads them. All
      # three or none: unset, connecting stays off and nothing else changes. Set, it
      # also needs `kit-database` above (a connection belongs to an account), or the
      # pod refuses to start rather than offer a connect with nowhere to keep it.
      - name: KIT_GITHUB_APP_SLUG
        valueFrom:
          secretKeyRef:
            name: kit-github
            key: slug
            optional: true
      - name: KIT_GITHUB_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: kit-github
            key: client-id
            optional: true
      - name: KIT_GITHUB_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: kit-github
            key: client-secret
            optional: true
      # BEH-PULL-1 (kit#88): the project list and every read come from GitHub,
      # re-read every KIT_PROJECTS_POLL seconds (default 120), not from the pod's
      # clone. Writes still go to the clone above and are pushed to kit/hosted, so
      # this names the SAME branch — another branch here would serve a corpus the
      # edits never reach. Remove the entry to read the clone, as before.
      - name: KIT_PROJECTS
        value: "jemmy8oy-northstar/kit@kit/hosted:prototypes/behaviour-ast/behaviours"
      # BEH-NOTIFY-1 (claude-code-bot#118): the agent's notifications, which replaced
      # Telegram. A FILE in the agent's PRIVATE repo, read with the same App token as
      # KIT_PROJECTS, so the App needs read access to claude-code-bot; until it has
      # it, the Notifications page says so rather than showing an empty feed.
      - name: KIT_AGENT_FEED
        value: "jemmy8oy-northstar/claude-code-bot@agent/notifications:notifications.jsonl"
      # BEH-NOTIFY-5: when the agent next wakes, from the pause file its scheduler reads
      # (state/suspend.json on claude-code-bot's dev, the branch the agent commits to).
      # Same repo and App access as the feed above. Unset, the page says it cannot tell.
      - name: KIT_AGENT_SCHEDULE
        value: "jemmy8oy-northstar/claude-code-bot@dev:state/suspend.json"
      # BEH-NOTIFY-3: web push to his home-screen app. A VAPID key pair in the `kit-push`
      # secret (keys public-key and private-key), created by hand like the others.
      # OPTIONAL on purpose, like KIT_DATABASE: until it exists Kit runs exactly as
      # before, the Notifications page says push is not switched on, and nothing polls.
      - name: KIT_PUSH_PUBLIC_KEY
        valueFrom:
          secretKeyRef:
            name: kit-push
            key: public-key
            optional: true
      - name: KIT_PUSH_PRIVATE_KEY
        valueFrom:
          secretKeyRef:
            name: kit-push
            key: private-key
            optional: true
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
# Write-back switches itself on only when there is a push credential: the `kit-git`
# token or the `kit-github` App (see above). Without either, every edit is answered "on this server's disk
# only" (kit#142), which is true. Write-back with no credential would mean commits
# nobody can push, in a container that is wiped on restart.
